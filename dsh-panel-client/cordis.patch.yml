# bionic-agent-panel bundle patch —— 把面板插件挂进 DSH 配置树。
# 安装脚本会把它加进 desktop profile 的 dsh.profile.bundles，
# DSH 启动时会自动把本文件层叠进配置树（无需手工改 profile 的 cordis.patch.yml）。
# 这一行绝不能写行尾注释：DSH 商城预检用正则抓 id 值，行尾注释会让它抓不到 entry ID。
- insert:
    - id: bionic-agent-panel
      name: '@local/bionic-agent-panel'
      config:
        # 面板承载的管理界面地址。宿主半（lib/index.js）会自动在 8899 起
        # FastAPI 服务。改端口就改这一行 —— 前端不必跟着改：iframe 走的是
        # 下面的 mountPath 同源反代，地址由宿主半在运行时决定。
        adminUrl: 'http://127.0.0.1:8899'
        # 插件加载时自动拉起管理服务；设为 false 则需自己跑 bionic-agent-admin。
        autoStart: true
        # 可选：指定 python 解释器。留空则自动探测（.venv → Miniforge → PATH）。
        pythonPath: ''
        # 把面板挂到 DSH 自己服务器上的同源前缀（默认 /bionic-panel）。
        # 好处：iframe 与 XHR 都不跨源，不受浏览器策略影响，也不怕端口错位。
        # 设为 '' 可关掉，退化成直接跨源打开 http://127.0.0.1:8899。
        mountPath: '/bionic-panel'
