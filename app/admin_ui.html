<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bionic Agent 管理面板</title>
<style>
  /* 配色全部走变量，三种来源：
       1. 默认（下面 :root）= 深色，独立打开面板时用；
       2. [data-theme="light"] = 浅色；
       3. 跟随 DSH：脚本从同源父窗口读 --dsw-alias-* 令牌，写成 :root 上的内联变量，
          内联样式优先级高于这里的规则，所以不用为它再写一套选择器。
     新增颜色一律先加变量，不要在规则里写死 —— 否则浅色主题下会出现看不清的死角。 */
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1e222e; --line:#2a2f3c;
    --txt:#e6e9ef; --muted:#8a92a6; --accent:#5b8cff; --accent2:#39d0a3;
    --warn:#ffb454; --danger:#ff6b6b; --ok:#39d0a3;
    --chip:#222838;
    --header1:#171a23; --header2:#13161e;
    --tag-bg:#20283b; --tag-fg:#9db4ff;
    --pill-protected-bg:#33291a; --pill-review-bg:#16312a;
    --on-warn:#222222;
    --btn-bg:#2f66e0; --btn-fg:#ffffff; --on-danger:#ffffff;
    --toast-err-fg:#ffd2d2; --toast-ok-fg:#cffaec;
    --mask:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#f7f8fa; --panel:#ffffff; --panel2:#f2f4f7; --line:#e1e5ec;
    --txt:#1a1d24; --muted:#68707f; --accent:#3b6ef5; --accent2:#0f9d76;
    --warn:#b45309; --danger:#dc2626; --ok:#0f9d76;
    --chip:#eef1f6;
    --header1:#ffffff; --header2:#f4f6fa;
    --tag-bg:#e8edfa; --tag-fg:#3b5bdb;
    --pill-protected-bg:#fdf1dc; --pill-review-bg:#dff5ec;
    --on-warn:#ffffff;
    --btn-bg:#2f66e0; --btn-fg:#ffffff; --on-danger:#ffffff;
    --toast-err-fg:#7f1d1d; --toast-ok-fg:#065f46;
    --mask:rgba(20,24,32,.42); --shadow:rgba(20,24,32,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--header1),var(--header2))}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .stats{margin-left:auto;display:flex;gap:14px;color:var(--muted);font-size:12px}
  header .stats b{color:var(--txt)}
  .tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--panel)}
  .tab{padding:8px 16px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;
    border-bottom:2px solid transparent}
  .tab.active{color:var(--txt);border-bottom-color:var(--accent)}
  .view{display:none;padding:16px;max-width:1100px;margin:0 auto}
  .view.active{display:block}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;padding:7px 10px;font-size:13px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;font-family:inherit}
  button{background:var(--btn-bg);color:var(--btn-fg);border:none;border-radius:7px;padding:7px 14px;
    cursor:pointer;font-size:13px;font-weight:500}
  button.ghost{background:var(--chip);color:var(--txt)}
  button.danger{background:var(--danger);color:var(--on-danger)}
  button.ok{background:var(--ok);color:var(--on-danger)}
  button.warn{background:var(--warn);color:var(--on-warn)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .mem{border-left:3px solid var(--accent)}
  .mem.archived{border-left-color:var(--muted);opacity:.78}
  .mem .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .mem .id{color:var(--muted);font-size:12px}
  .mem .cat{background:var(--chip);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--accent2)}
  .mem .content{white-space:pre-wrap;word-break:break-word;margin:4px 0}
  .mem .meta{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
  .mem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{background:var(--tag-bg);border-radius:5px;padding:1px 7px;font-size:11px;color:var(--tag-fg);margin-right:4px}
  .score{font-size:11px;color:var(--warn)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .modal-bg{position:fixed;inset:0;background:var(--mask);display:none;align-items:center;justify-content:center;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(640px,92vw);max-height:86vh;overflow:auto}
  .modal h3{margin:0 0 14px}
  .modal label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
  .modal input,.modal textarea,.modal select{width:100%}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .search-type{display:flex;gap:6px;align-items:center}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:var(--chip);color:var(--muted)}
  .pill.protected{color:var(--warn);background:var(--pill-protected-bg)}
  .pill.review{color:var(--accent2);background:var(--pill-review-bg)}
  .detail-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  .detail-grid .k{color:var(--muted)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);padding:10px 18px;border-radius:8px;display:none;z-index:99;box-shadow:0 6px 24px var(--shadow)}
  .toast.show{display:block}
  .toast.err{border-color:var(--danger);color:var(--toast-err-fg)}
  .toast.ok{border-color:var(--ok);color:var(--toast-ok-fg)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .rel-node{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;margin:4px;max-width:280px;vertical-align:top}
  .rel-edge{color:var(--muted);font-size:11px;margin:0 4px}
  .badge{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--chip)}
  .badge.pending{color:var(--warn)}
  .badge.applied{color:var(--ok)}
  .badge.rejected{color:var(--danger)}
  details{margin-top:6px}
  summary{cursor:pointer;color:var(--muted);font-size:12px}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;overflow:auto;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>🧠 Bionic Agent 管理面板</h1>
  <div class="stats" id="stats"></div>
  <select id="themeSel" title="配色：选「跟随 DSH」时自动同步软件的明暗与品牌色"
    style="padding:4px 8px;font-size:12px;border-radius:6px">
    <option value="dsh">跟随 DSH</option>
    <option value="dark">深色</option>
    <option value="light">浅色</option>
  </select>
</header>

<div class="tabs">
  <button class="tab active" data-tab="memories">记忆</button>
  <button class="tab" data-tab="starmap">星图</button>
  <button class="tab" data-tab="tasks">任务</button>
  <button class="tab" data-tab="governance">治理</button>
</div>

<!-- ========== 记忆 ========== -->
<div class="view active" id="memories">
  <div class="toolbar">
    <input id="memSearch" placeholder="关键词 / 留空列出最近" style="min-width:240px" />
    <select id="memCategory">
      <option value="">全部分类</option>
    </select>
    <label class="search-type">
      <input type="radio" name="memMode" value="keyword" checked /> 关键词
    </label>
    <label class="search-type">
      <input type="radio" name="memMode" value="semantic" /> 语义
    </label>
    <button id="memSearchBtn">搜索</button>
    <label style="color:var(--muted)"><input type="checkbox" id="memArchived" /> 含归档</label>
    <button class="ghost" id="memRefresh">刷新</button>
    <button id="memNew">+ 新建记忆</button>
  </div>
  <div id="memList"></div>
</div>

<!-- ========== 星图 ========== -->
<div class="view" id="starmap">
  <div class="toolbar">
    <button id="starReload">刷新星图</button>
    <label style="color:var(--muted)">
      语义阈值
      <input id="starThreshold" type="range" min="0.40" max="0.80" step="0.01" value="0.62"
        style="vertical-align:middle;width:120px" />
      <span id="starThresholdVal" style="display:inline-block;min-width:34px">0.62</span>
    </label>
    <label style="color:var(--muted)"><input type="checkbox" id="starArchived" /> 含归档</label>
    <span id="starLegend" style="margin-left:auto;font-size:12px;color:var(--muted)"></span>
  </div>
  <div id="starCanvasWrap" style="position:relative;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:var(--bg);height:calc(100vh - 230px);min-height:420px">
    <div id="starHint" style="position:absolute;left:12px;bottom:10px;font-size:12px;
      color:var(--muted);pointer-events:none;z-index:2">
      拖动旋转 · 滚轮缩放 · 点星看原文
    </div>
    <div id="starInfo" style="position:absolute;right:12px;top:12px;max-width:320px;
      font-size:12px;display:none;background:var(--card);border:1px solid var(--line);
      border-radius:8px;padding:10px;box-shadow:var(--shadow);z-index:2"></div>
  </div>
</div>

<!-- ========== 任务 ========== -->
<div class="view" id="tasks">
  <div class="toolbar">
    <button id="taskNew">+ 新建任务</button>
    <button class="ghost" id="taskRefresh">刷新</button>
  </div>
  <div id="taskList"></div>
</div>

<!-- ========== 治理 ========== -->
<div class="view" id="governance">
  <div class="toolbar">
    <button id="govScore">评分扫描</button>
    <button id="govDetect">冲突检测</button>
    <button id="govDup">重复识别</button>
    <button id="govConsol">巩固候选</button>
    <button id="govWarmup">预热嵌入</button>
    <select id="govCategory"><option value="">全部分类</option></select>
    <span id="embStatus" class="pill"></span>
    <button class="ghost" id="govRefresh">刷新</button>
  </div>
  <div id="govOut"></div>
</div>

<!-- 编辑/新建 记忆 Modal -->
<div class="modal-bg" id="memModalBg">
  <div class="modal">
    <h3 id="memModalTitle">新建记忆</h3>
    <input type="hidden" id="memId" />
    <label>内容 *</label>
    <textarea id="memContent" rows="5"></textarea>
    <label>分类</label>
    <input id="memCat" placeholder="general" />
    <label>来源</label>
    <input id="memSource" placeholder="admin-ui" />
    <label>置信度 (0-1)</label>
    <input id="memConf" type="number" step="0.05" min="0" max="1" value="0.8" />
    <label>标签 (逗号分隔)</label>
    <input id="memTags" placeholder="工作, 偏好" />
    <div class="row">
      <button class="ghost" id="memCancel">取消</button>
      <button id="memSave">保存</button>
    </div>
  </div>
</div>

<!-- 记忆详情 Modal -->
<div class="modal-bg" id="detailModalBg">
  <div class="modal">
    <h3>记忆详情 <span id="detailId" class="muted small"></span></h3>
    <div id="detailBody"></div>
    <div class="row">
      <button id="detailFeedback">标记有用</button>
      <button class="ghost" id="detailClose">关闭</button>
    </div>
  </div>
</div>

<!-- 新建/编辑 任务 Modal -->
<div class="modal-bg" id="taskModalBg">
  <div class="modal">
    <h3>新建任务</h3>
    <label>标题 *</label>
    <input id="taskTitle" placeholder="任务标题" />
    <label>目标 *</label>
    <textarea id="taskGoal" rows="4" placeholder="这个任务要达成什么"></textarea>
    <div class="row">
      <button class="ghost" id="taskCancel">取消</button>
      <button id="taskSave">创建</button>
    </div>
  </div>
</div>

<!-- 任务阶段 Modal -->
<div class="modal-bg" id="taskStageBg">
  <div class="modal">
    <h3 id="taskStageTitle">阶段交接</h3>
    <input type="hidden" id="stageTaskId" />
    <input type="hidden" id="stageMode" />
    <label>摘要</label>
    <textarea id="stageSummary" rows="4"></textarea>
    <label>状态 JSON (可选)</label>
    <textarea id="stageState" rows="3" placeholder='{"k":"v"}'>{}</textarea>
    <div class="row">
      <button class="ghost" id="stageCancel">取消</button>
      <button id="stageSave">提交</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 基路径：独立打开时为空串（同源 8899）；被 DSH 以 /bionic-panel 前缀反代时，
// 页面里的绝对路径 /api/... 必须补此前缀，否则请求会打到 DSH 自己的路由上。
const BASE = (() => {
  try {
    const q = new URLSearchParams(location.search).get('base');
    if (q) return q.replace(/\/+$/, '');
  } catch {}
  return (typeof window!=='undefined' && window.__BIONIC_BASE__) || '';
})();
const withBase = u => (u.startsWith('/') ? BASE + u : u);

// ───────────────────────── 主题 ─────────────────────────
// 三种模式：
//   dsh   跟随 DSH —— 从同源父窗口读 --dsw-alias-* 令牌，直接套到本页变量上。
//         同源是前提：面板走 /bionic-panel 反代，与 DSH 同源，所以父窗口的
//         document 和 getComputedStyle 都读得到；独立打开（8899）时没有父窗口，
//         自动退回深色。跨源时会抛 SecurityError，同样退回。
//   dark  内置深色      light  内置浅色
//
// 为什么不干脆内嵌一份 DSH 的主题 CSS：那套有 403 个令牌、内含字体与代码高亮，
// 面板只用得上十来个；更关键的是它随 DSH 版本变，抄一份就会过期。读令牌永远同步。
const THEME_KEY = 'bionic-theme';
const THEME_PREFS = ['dsh', 'dark', 'light'];
// 本页变量 ← DSH 令牌。顺序按「用途」而非名字对应，所以显式列出来。
const DSH_TOKEN_MAP = {
  '--bg': '--dsw-alias-bg-base',
  '--panel': '--dsw-alias-bg-layer-1',
  '--panel2': '--dsw-alias-bg-layer-2',
  '--chip': '--dsw-alias-bg-layer-3',
  '--line': '--dsw-alias-border-l2',
  '--txt': '--dsw-alias-label-primary',
  '--muted': '--dsw-alias-label-secondary',
  '--accent': '--dsw-alias-link',
  '--accent2': '--dsw-alias-state-success-primary',
  '--ok': '--dsw-alias-state-success-primary',
  '--warn': '--dsw-alias-state-warn-primary',
  '--danger': '--dsw-alias-state-error-primary',
  '--tag-bg': '--dsw-alias-bg-layer-3',
  '--tag-fg': '--dsw-alias-link',
  '--pill-protected-bg': '--dsw-alias-bg-layer-3',
  '--pill-review-bg': '--dsw-alias-bg-layer-3',
  '--header1': '--dsw-alias-bg-layer-1',
  '--header2': '--dsw-alias-bg-layer-1',
  // 按钮单独一套：DSH 的主按钮是「反色实块」（暗色下近白底黑字），不是品牌蓝。
  // 直接拿 --accent 当底色会把白字压到 3:1 左右，读不清。
  '--btn-bg': '--dsw-alias-button-primary-fill',
  '--btn-fg': '--dsw-alias-label-primary-foreground',
  '--on-warn': '--dsw-alias-label-primary-foreground'
};

const themePref = () => {
  try {
    const v = localStorage.getItem(THEME_KEY);
    return THEME_PREFS.includes(v) ? v : 'dsh';
  } catch { return 'dsh'; }
};

/** 读同源父窗口的主题令牌；拿不到就返回 null（跨源 / 不在 iframe 里）。 */
function readDshTheme() {
  try {
    if (window.parent === window) return null;          // 独立打开，没有父窗口
    const doc = window.parent.document;                 // 跨源会在这里抛 SecurityError
    if (!doc || !doc.body) return null;
    const cs = window.parent.getComputedStyle(doc.body);
    const dark = doc.body.hasAttribute('data-ds-dark-theme');
    const out = {};
    for (const [mine, theirs] of Object.entries(DSH_TOKEN_MAP)) {
      const v = String(cs.getPropertyValue(theirs) || '').trim();
      if (v) out[mine] = v;
    }
    // 一个令牌都没读到，说明父页面的主题还没挂上（或不是 DSH 页面），当作不可用
    return Object.keys(out).length >= 5 ? { dark, vars: out } : null;
  } catch {
    return null;
  }
}

/** 把变量写成根元素的内联样式：内联优先级高于 <style> 里的规则，省掉一套重复选择器。 */
function paintVars(vars) {
  const root = document.documentElement;
  for (const name of Object.keys(DSH_TOKEN_MAP)) root.style.removeProperty(name);
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v);
}

let themeWatch = null;

function applyTheme(pref = themePref()) {
  const root = document.documentElement;
  // 每次先卸掉上一次「跟随 DSH」留下的内联变量，避免切到内置主题时残留
  paintVars({});
  if (themeWatch) { try { themeWatch.disconnect(); } catch {} themeWatch = null; }

  if (pref === 'dsh') {
    const got = readDshTheme();
    if (got) {
      root.dataset.theme = got.dark ? 'dark' : 'light';
      paintVars(got.vars);
      // DSH 里切主题时本页要跟着变：监听父页面 body 的属性变化（data-ds-dark-theme）。
      // 用父窗口自己的 MutationObserver 构造器 —— 跨 realm 的对象不该混用。
      try {
        const ParentObserver = window.parent.MutationObserver || MutationObserver;
        themeWatch = new ParentObserver(() => applyTheme('dsh'));
        themeWatch.observe(window.parent.document.body, {
          attributes: true, attributeFilter: ['data-ds-dark-theme', 'class', 'style']
        });
      } catch { themeWatch = null; }
    } else {
      // 读不到（独立打开/跨源）→ 用深色，但不动用户的选择
      root.dataset.theme = 'dark';
    }
  } else {
    root.dataset.theme = pref;   // 内置主题：清掉内联变量，交给上面两套 :root 规则
  }
  const sel = document.getElementById('themeSel');
  if (sel && sel.value !== pref) sel.value = pref;
}

document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('themeSel');
  if (sel) {
    sel.value = themePref();
    sel.addEventListener('change', () => {
      try { localStorage.setItem(THEME_KEY, sel.value); } catch {}
      applyTheme(sel.value);
    });
  }
  applyTheme();
});
// 父页面的 body 属性可能在 DOMContentLoaded 之前/之后就绪，补一次
applyTheme();

// 报到：让后端记一笔"页面真的在浏览器里跑起来了"。
//
// 为什么要它：宿主半的 panel-boot.log 只能证明 Node 侧加载了插件；iframe 到底
// 有没有真的渲染出来、脚本有没有真的求值，只有页面自己知道。重启后若出问题，
// data/panel-client.log 有记录 = 浏览器端没问题、该查别处；没有 = 卡在加载前。
fetch(withBase('/api/ping'), {method:'GET'}).catch(()=>{});

const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const api = async (url, opts={}) => {
  const r = await fetch(withBase(url), Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  const j = await r.json().catch(()=>({ok:false,message:'响应解析失败'}));
  return j;
};
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toast(msg, kind='ok'){
  const t=$('#toast'); t.textContent=msg; t.className='toast show '+kind;
  setTimeout(()=>t.className='toast', 2600);
}
async function loadStats(){
  const j = await api('/api/stats');
  if(j.ok){
    const s=j.data;
    $('#stats').innerHTML = [
      ['记忆', s.memories_total], ['活跃', s.memories_active], ['归档', s.memories_archived],

/* ---------- 记忆星图 ---------- *
 * 用 3d-force-graph（MIT，自包含 three.js，本地托管在 /static/）。
 * 为什么不再手写 Canvas：上一版是手工透视投影，几何没毛病但观感很朴素
 * ——没有光照、没有景深、连线僵直，看着像散点图而不是星图。这个库带
 * 真正的 WebGL 渲染、力导向自动布局、辉光粒子，代价是 1.39MB 的本地文件。
 *
 * 布局仍然由后端 app/star_map.py 决定（按 category 分天区），这里只是
 * 把后端的 x/y/z 当成初始位置喂进去，不再让力的模拟把天区搅散。
 */
const STAR = {
  data: null,
  graph: null,
  libReady: false,
  libError: '',
};

// 类别 → 颜色。深浅两套都选了对比度够的色相，同一类别永远同一颜色。
const STAR_COLORS = {
  '教训': '#ff7a5c', '项目': '#5aa9ff', '环境': '#3ee0a8',
  '授权': '#ffc75c', 'preference': '#c589ff', 'general': '#94a3b8',
};
const starColor = (cat) => STAR_COLORS[cat] || STAR_COLORS.general;

function loadStarLib(){
  if (STAR.libReady) return Promise.resolve(true);
  if (window.ForceGraph3D) { STAR.libReady = true; return Promise.resolve(true); }
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = '/static/3d-force-graph.min.js';
    s.onload = () => {
      STAR.libReady = typeof window.ForceGraph3D === 'function';
      if (!STAR.libReady) STAR.libError = '文库加载后仍找不到 ForceGraph3D';
      resolve(STAR.libReady);
    };
    s.onerror = () => { STAR.libError = '3d-force-graph 加载失败（/static/3d-force-graph.min.js）'; resolve(false); };
    document.head.appendChild(s);
  });
}

async function loadStarMap(){
  const ok = await loadStarLib();
  if (!ok) {
    toast(STAR.libError || '3D 库没加载起来', 'err');
    $('#starLegend').textContent = STAR.libError;
    return false;
  }
  const th = parseFloat($('#starThreshold').value) || 0.62;
  const inc = $('#starArchived').checked;
  let j;
  try {
    j = await api(`/api/starmap?threshold=${th}&include_archived=${inc?'true':'false'}`);
  } catch (e) { toast('星图加载失败：' + e.message, 'err'); return false; }
  if (!j.ok) { toast(j.message || '星图加载失败', 'err'); return false; }

  STAR.data = j.data || { nodes: [], links: [], edges: [] };
  const m = STAR.data.meta || {};
  $('#starLegend').textContent =
    `${m.node_count||0} 个记忆 · ${m.edge_count||0} 条连线 · ${m.cluster_count||0} 个天区`;
  renderStarLegend();
  buildStarGraph();
  return true;
}

function renderStarLegend(){
  const el = $('#starInfo');
  if (!el) return;
  const cats = {};
  (STAR.data?.nodes || []).forEach(n => { cats[n.category] = (cats[n.category] || 0) + 1; });
  el.style.display = 'block';
  el.innerHTML = '<b>天区</b><br>' + Object.entries(cats)
    .sort((a, b) => b[1] - a[1])
    .map(([c, n]) => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;
      background:${starColor(c)};margin-right:5px;box-shadow:0 0 6px ${starColor(c)}"></span>
      ${esc(c)} <span style="color:var(--muted)">${n}</span>`)
    .join('<br>');
}

/** 读 CSS 变量，让 3D 场景跟着面板主题走 */
function starPalette(){
  const css = getComputedStyle(document.documentElement);
  const get = (k, d) => (css.getPropertyValue(k) || '').trim() || d;
  const dark = (document.documentElement.dataset.theme || 'dark') !== 'light';
  return {
    dark,
    bg: get('--bg', dark ? '#0e1116' : '#ffffff'),
    txt: get('--txt', dark ? '#e6e9ef' : '#1a1d24'),
    muted: get('--muted', '#8d9bad'),
  };
}

function buildStarGraph(){
  const host = $('#starCanvasWrap');
  if (!host || !STAR.data) return;
  const pal = starPalette();
  const rect = host.getBoundingClientRect();
  const W = Math.max(320, Math.round(rect.width));
  const H = Math.max(280, Math.round(rect.height));

  /* 坐标尺度是个真坑：后端给的 x/y/z 在 ±1.3 量级，直接乘 1400 会让
   * 天球跨度到 3000 单位，而节点半径只有个位数 —— 相机退到 5712 之外，
   * 整屏只有 141 个着色像素，看着就是几粒灰尘。
   * 缩放系数改小到 260，配合固定的相机距离，节点才是"星"而不是"尘"。*/
  const SCALE = 260;
  /* 必须先减去质心再摆位。后端按类别定天区，各路天区是不对称的
   * （实测"教训"天区 y=+1601、"授权"在 y=-1330），整体质心并不在原点。
   * 相机永远对着原点取景 —— 不居中就会出现"明明只占了 49% 宽，却有 5 个
   * 节点被裁到画外"这种自相矛盾的现象。 */
  const raw = STAR.data.nodes.map(n => ({ x: n.x * SCALE, y: n.y * SCALE, z: n.z * SCALE }));
  const c = raw.reduce((a, r) => ({ x: a.x + r.x / raw.length, y: a.y + r.y / raw.length, z: a.z + r.z / raw.length }), { x: 0, y: 0, z: 0 });
  const nodes = STAR.data.nodes.map((n, i) => ({
    id: n.id, ...n,
    x: raw[i].x - c.x, y: raw[i].y - c.y, z: raw[i].z - c.z,
    fx: raw[i].x - c.x, fy: raw[i].y - c.y, fz: raw[i].z - c.z,   // 钉死，不让力模拟揉散天区
  }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = (STAR.data.edges || [])
    .filter(e => byId.has(e.source) && byId.has(e.target))
    .map(e => ({ source: e.source, target: e.target, kind: e.kind, weight: e.weight ?? 0.5 }));

  if (STAR.graph) { try { host.innerHTML = ''; } catch {} STAR.graph = null; }

  const catOf = (v) => {
    const id = (v && typeof v === 'object') ? v.id : v;
    return byId.get(id)?.category;
  };

  const G = ForceGraph3D()(host)
    .width(W).height(H)
    .backgroundColor(pal.bg)
    .showNavInfo(false)
    .nodeRelSize(9)
    .nodeVal(n => 2.4 + Math.log2(Math.max(20, n.size || 60) / 20) * 1.6)
    .nodeColor(n => starColor(n.category))
    .nodeOpacity(0.95)
    .nodeResolution(16)
    .nodeLabel(n => `<div style="font-size:12px;max-width:280px;line-height:1.5">${esc(n.label)}</div>`)
    .linkColor(l => l.kind === 'semantic'
      ? withAlpha(starColor(catOf(l.source)), 0.30)
      : withAlpha(pal.muted, l.kind === 'tag' ? 0.10 : 0.38))
    .linkWidth(l => l.kind === 'semantic' ? 1.2 : l.kind === 'link' ? 2.0 : 0.5)
    .linkOpacity(0.8)
    .linkDirectionalParticles(l => (l.kind === 'semantic' && l.weight > 0.65) ? 2 : 0)
    .linkDirectionalParticleWidth(1.8)
    .linkDirectionalParticleSpeed(0.004)
    .linkDirectionalParticleColor(l => starColor(catOf(l.source)))
    .onNodeClick(n => showStarInfo(n));

  // 类别名挂在各天区质心上，省得用户对着颜色猜
  G.nodeThreeObject(() => null);

  G.graphData({ nodes, links });
  STAR.graph = G;
  paintStarLabels(G, nodes);

  setTimeout(() => { try { frameStar(G, nodes); } catch (e) { console.warn('取景失败', e); } }, 400);
  return G;
}

/** 自适应取景。
 * zoomToFit 只保证"看得见"，实测只填满画布 16.8%（横向），星团缩在中间一小块，
 * 看着就小气。这里改成：扫一圈相机方位找屏幕包围盒最大的方向，再按"投影尺寸与
 * 相机距离近似成反比"反推距离，把内容撑到画布的 ~86%。一次迭代即可收敛。*/
async function frameStar(G, nodes){
  const host = $('#starCanvasWrap');
  if (!host || !nodes.length) return;
  const W = host.clientWidth || 800, H = host.clientHeight || 500;
  /* 踩过的坑，别再改回去：cameraPosition()/zoomToFit() 都是**异步生效**的，
   * 设完立刻调 graph2ScreenCoords() 读到的是上一次相机的投影 —— 实测
   * zoomToFit 后立即测 bbox 得 582x722，等两帧后变成 194x279。
   * 所以每次动相机后面都必须 settle() 再量，否则算出来的距离完全是错的
   * （上一版就这么把相机推到了 1545，画面只剩中间一小坨）。*/
  const settle = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const bbox = () => {
    const pts = nodes.map(n => G.graph2ScreenCoords(n.x, n.y, n.z));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const w = Math.max(...xs) - Math.min(...xs);
    const h = Math.max(...ys) - Math.min(...ys);
    return { w, h, score: Math.min(w / W, h / H), clipped: w / W > 0.98 || h / H > 0.98 };
  };
  const setCam = (az, el, r) => {
    const a = az * Math.PI / 180, e = el * Math.PI / 180;
    G.cameraPosition({ x: r * Math.cos(e) * Math.sin(a), y: r * Math.sin(e), z: r * Math.cos(e) * Math.cos(a) }, undefined, 0);
  };

  // 基准距离：先用 zoomToFit 找一个"全都能看见"的距离，再围绕它做方位扫描
  try { G.zoomToFit(0, 60); } catch {}
  await settle();
  const cam = G.cameraPosition();
  const R0 = Math.hypot(cam.x || 0, cam.y || 0, cam.z || 1) || 800;

  // 方位扫描：一圈 8 个方位 × 4 个仰角。挑"两个方向都尽量满且不裁边"的。
  let best = { az: 0, el: 0, score: -1 };
  for (let az = 0; az < 360; az += 45) {
    for (const el of [-20, 0, 20, 40]) {
      setCam(az, el, R0);
      await settle();
      const b = bbox();
      const sc = b.clipped ? b.score * 0.25 : b.score;
      if (sc > best.score) best = { az, el, score: sc };
    }
  }

  // 在这个方位上反推距离：投影尺寸与相机距离近似成反比。
  // 迭代两轮足够 —— 因为近似不是严格反比（透视投影），一轮会差一点。
  setCam(best.az, best.el, R0);
  await settle();
  let R = R0;
  const target = 0.70;   // 实测 0.80 仍有 1 个边缘节点出画（节点半径约 18px），0.70 稳定不裁
  for (let i = 0; i < 2; i++) {
    const b = bbox();
    const cur = Math.max(b.w / W, b.h / H) || 0.3;
    R = Math.max(120, R * (cur / target));
    setCam(best.az, best.el, R);
    await settle();
  }
  // 收尾：如果还是偏空（横竖比例悬殊导致按 max 收敛后另一边很小），
  // 就把距离再收紧一点，宁可略裁边也不要一小坨浮在中间。
  const fin = bbox();
  if (Math.max(fin.w / W, fin.h / H) < 0.55) {
    setCam(best.az, best.el, R * 0.75);
    await settle();
  }
}

/** 用 CSS 覆盖层画天区标签：比在 3D 里塞 Sprite 简单，字号也清晰 */
function paintStarLabels(G, nodes){
  const host = $('#starCanvasWrap');
  if (!host) return;
  host.querySelectorAll('.star-cat-label').forEach(e => e.remove());
  const groups = {};
  nodes.forEach(n => { (groups[n.category] = groups[n.category] || []).push(n); });
  Object.entries(groups).forEach(([cat, arr]) => {
    const c = arr.reduce((a, n) => ({ x: a.x + n.x / arr.length, y: a.y + n.y / arr.length, z: a.z + n.z / arr.length }), { x:0, y:0, z:0 });
    const el = document.createElement('div');
    el.className = 'star-cat-label';
    el.textContent = cat;
    el.style.cssText = `position:absolute;transform:translate(-50%,-50%);pointer-events:none;
      font-size:12px;font-weight:600;letter-spacing:.08em;color:${starColor(cat)};
      text-shadow:0 0 8px ${withAlpha(starColor(cat), .85)}, 0 0 2px #000;opacity:.9;z-index:1`;
    host.appendChild(el);
    STAR.labels = STAR.labels || [];
    STAR.labels.push({ el, pos: c });
  });
  const sync = () => {
    if (!STAR.graph || !STAR.labels) return;
    const g = STAR.graph;
    STAR.labels.forEach(({ el, pos }) => {
      try {
        const p = g.graph2ScreenCoords(pos.x, pos.y, pos.z);
        const w = host.clientWidth, h = host.clientHeight;
        const visible = p.x > -60 && p.x < w + 60 && p.y > -30 && p.y < h + 30;
        el.style.display = visible ? 'block' : 'none';
        el.style.left = p.x + 'px';
        el.style.top = p.y + 'px';
      } catch {}
    });
    requestAnimationFrame(sync);
  };
  if (!STAR.labelLoop) { STAR.labelLoop = true; requestAnimationFrame(sync); }
}

function withAlpha(color, a){
  const c = (color || '').trim();
  const hex = c.replace('#', '');
  if (/^[0-9a-fA-F]{6}$/.test(hex)) {
    const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  if (/^[0-9a-fA-F]{3}$/.test(hex)) {
    const r = parseInt(hex[0] + hex[0], 16), g = parseInt(hex[1] + hex[1], 16), b = parseInt(hex[2] + hex[2], 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  return c;
}

/** 从连线端点取类别色（主题切换时用；byId 是 buildStarGraph 内部的，这里走节点对象） */
function catOfLink(l){
  const pick = (v) => (v && typeof v === 'object') ? v.category : undefined;
  return pick(l.source) || pick(l.target);
}

function showStarInfo(n){
  const el = $('#starInfo');
  if (!el) return;
  if (!n) { renderStarLegend(); return; }
  el.style.display = 'block';
  el.innerHTML = `
    <div style="font-weight:600;margin-bottom:6px">${esc(n.label)}</div>
    <div style="color:var(--muted);margin-bottom:8px">
      ${esc(n.category)} · 重要 ${n.importance} · 新鲜 ${n.freshness} · 被用 ${n.access_count} 次
    </div>
    <div style="margin-bottom:8px">${esc((n.tags || []).join(' '))}</div>
    <button class="ghost" id="starOpenFull" style="font-size:12px">打开完整记忆</button>`;
  $('#starOpenFull').onclick = () => {
    $$('.tab').forEach(x => x.classList.remove('active'));
    $$('.view').forEach(x => x.classList.remove('active'));
    document.querySelector('.tab[data-tab="memories"]').classList.add('active');
    $('#memories').classList.add('active');
    loadMemories();
    const box = document.getElementById('mem_' + n.id);
    if (box) {
      box.scrollIntoView({ block: 'center' });
      box.style.outline = '2px solid var(--accent)';
      setTimeout(() => box.style.outline = '', 1600);
    }

}

function bindStarEvents(){
  $('#starReload').onclick = () => {
    if (STAR.graph) buildStarGraph(); else loadStarMap();
  };
  $('#starThreshold').oninput = () => { $('#starThresholdVal').textContent = $('#starThreshold').value; };
  $('#starThreshold').onchange = loadStarMap;
  $('#starArchived').onchange = loadStarMap;
  // 主题切换后重建场景（WebGL 背景色与连线色都取自 CSS 变量）
  new MutationObserver(() => {
    if (!STAR.graph || !document.getElementById('starmap')?.classList.contains('active')) return;
    // 只换颜色，不重建 —— 重建会把用户调好的视角重置掉
    const pal = starPalette();
    try {
      STAR.graph.backgroundColor(pal.bg);
      STAR.graph.linkColor(l => l.kind === 'semantic'
        ? withAlpha(starColor(catOfLink(l)), 0.30)
        : withAlpha(pal.muted, l.kind === 'tag' ? 0.10 : 0.38));
    } catch {}
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'style'] });
  window.addEventListener('resize', () => {
    if (!STAR.graph || !document.getElementById('starmap')?.classList.contains('active')) return;
    const host = $('#starCanvasWrap');
    if (!host) return;
    const r = host.getBoundingClientRect();
    try { STAR.graph.width(Math.max(320, r.width)).height(Math.max(280, r.height)); } catch {}
  });
}


/* ---------- 记忆 ---------- */
async function loadCategories(){
  // 从记忆列表推断分类
  const j = await api('/api/memories?limit=200');
  if(!j.ok) return;
  const cats = [...new Set(j.data.map(m=>m.category).filter(Boolean))];
  const sel = $('#memCategory'); const cur=sel.value;
  sel.innerHTML = '<option value="">全部分类</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
  sel.value = cur;
  const gsel = $('#govCategory'); gsel.innerHTML = sel.innerHTML;
}
async function loadMemories(){
  const q = $('#memSearch').value.trim();
  const cat = $('#memCategory').value;
  const inc = $('#memArchived').checked;
  const mode = $('input[name=memMode]:checked').value;
  let url, j;
  if(mode==='semantic' && q){
    j = await api(`/api/memories/search/semantic?q=${encodeURIComponent(q)}&limit=20&category=${encodeURIComponent(cat)}`);
    if(j.ok && j.data.degraded){
      toast('嵌入模型未就绪，已降级为关键词检索', 'err');
      $('#memList').innerHTML = (j.data.results||[]).map(memCard).join('') || '<div class="empty">无结果</div>';
      return;
    }
    const list = j.ok ? (j.data.results||[]) : [];
    $('#memList').innerHTML = list.map(m=>memCard(m, true)).join('') || '<div class="empty">无结果</div>';
    return;
  }
  url = `/api/memories?limit=60&category=${encodeURIComponent(cat)}&include_archived=${inc?1:0}`;
  if(q) url += `&q=${encodeURIComponent(q)}`;
  j = await api(url);
  $('#memList').innerHTML = j.ok ? (j.data.length?j.data.map(m=>memCard(m)).join(''):'<div class="empty">暂无记忆，点「+ 新建记忆」</div>')
    : `<div class="empty">${esc(j.message)}</div>`;
}
function memCard(m, showScore=false){
  const arch = m.status==='archived';
  const tags = (m.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const flags = [];
  if(m.protected) flags.push('<span class="pill protected">保护</span>');
  if(m.memory_status==='pending_review') flags.push('<span class="pill review">待审</span>');
  const sc = showScore && m.similarity!=null ? `<span class="score">相似度 ${m.similarity.toFixed(3)}</span>` : '';
  return `<div class="card mem ${arch?'archived':''}" data-id="${m.id}" id="mem_${m.id}">
    <div class="top">
      <span class="id">#${m.id}</span>
      <span class="cat">${esc(m.category||'general')}</span>
      ${tags}${flags.join('')}${sc}
    </div>
    <div class="content">${esc(m.content)}</div>
    <div class="meta">
      <span>来源 ${esc(m.source||'')}</span>
      <span>置信 ${(m.confidence*100|0)}%</span>
      <span>${esc(m.created_at||'')}</span>
      <span>${esc(m.updated_at||'')}</span>
    </div>
    <div class="acts">
      <button class="ghost" onclick="viewDetail(${m.id})">详情</button>
      <button class="ghost" onclick="editMem(${m.id})">编辑</button>
      <button class="ghost" onclick="openLinks(${m.id})">关系</button>
      ${arch
        ? `<button class="ok" onclick="restoreMem(${m.id})">恢复</button>`
        : `<button class="warn" onclick="archiveMem(${m.id})">归档</button>
           <button class="ghost" onclick="protectMem(${m.id},true)">保护</button>
           <button class="ghost" onclick="reviewMem(${m.id})">置待审</button>`}
      ${arch?`<button class="danger" onclick="govArchive(${m.id})">治理归档</button>`:''}
    </div>
  </div>`;
}

$('#memSave').onclick = async ()=>{
  const id = $('#memId').value;
  const payload = {content:$('#memContent').value, category:$('#memCat').value,
    source:$('#memSource').value, confidence:parseFloat($('#memConf').value||0.8),
    tags:$('#memTags').value};
  let j;
  if(id){ j = await api(`/api/memories/${id}`, {method:'PUT', body:JSON.stringify(payload)}); }
  else { j = await api('/api/memories', {method:'POST', body:JSON.stringify(payload)}); }
  if(j.ok){ toast(id?'已更新':'已创建'); $('#memModalBg').classList.remove('show'); loadMemories(); loadStats(); }
  else toast(j.message||'失败', 'err');
};
async function editMem(id){
  const j = await api(`/api/memories/${id}`);
  if(!j.ok){ toast(j.message,'err'); return; }
  const m=j.data;
  $('#memModalTitle').textContent='编辑记忆 #'+id;
  $('#memId').value=id; $('#memContent').value=m.content; $('#memCat').value=m.category||'general';
  $('#memSource').value=m.source||'admin-ui'; $('#memConf').value=m.confidence||0.8;
  $('#memTags').value=(m.tags||[]).join(', ');
  $('#memModalBg').classList.add('show');
}
async function archiveMem(id){ const j=await api(`/api/memories/${id}/archive`,{method:'POST'}); toast(j.ok?'已归档':'失败', j.ok?'ok':'err'); loadMemories(); loadStats(); }
async function restoreMem(id){ const j=await api(`/api/memories/${id}/restore`,{method:'POST'}); toast(j.ok?'已恢复':'失败', j.ok?'ok':'err'); loadMemories(); loadStats(); }
async function protectMem(id,p){ const j=await api(`/api/memories/${id}/protect`,{method:'POST',body:JSON.stringify({protected:p})}); toast(j.ok?'已保护':'失败', j.ok?'ok':'err'); loadMemories(); }
async function reviewMem(id){ const j=await api(`/api/memories/${id}/review`,{method:'POST',body:JSON.stringify({reason:'admin-ui 置待审'})}); toast(j.ok?'已置待审':'失败', j.ok?'ok':'err'); loadMemories(); }
async function govArchive(id){ const j=await api(`/api/memories/${id}/governance-archive`,{method:'POST',body:JSON.stringify({reason:'admin-ui 治理归档'})}); toast(j.ok?'已治理归档':'失败', j.ok?'ok':'err'); loadMemories(); loadStats(); }

async function viewDetail(id){
  const j = await api(`/api/memories/${id}/details`);
  $('#detailId').textContent='#'+id;
  if(!j.ok){ $('#detailBody').innerHTML=`<div class="empty">${esc(j.message)}</div>`; }
  else{
    const d=j.data; const m=d.memory||{};
    let html = `<div class="detail-grid">`;
    for(const k of ['id','category','source','status','memory_status','created_at','updated_at','confidence','access_count']){
      if(m[k]!==undefined) html += `<div class="k">${k}</div><div>${esc(m[k])}</div>`;
    }
    html += `</div>`;
    if(m.tags&&m.tags.length) html += `<p class="small">标签: ${m.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</p>`;
    if(d.lifecycle) html += `<p class="small">生命周期: ${esc(d.lifecycle)}</p>`;
    if(d.governance){
      const g=d.governance;
      html += `<details open><summary>治理视图</summary><pre>${esc(JSON.stringify(g,null,2))}</pre></details>`;
    }
    if(d.relations){
      html += `<p class="small">关系 (${d.relations.length})</p>`;
      html += d.relations.slice(0,20).map(r=>`<span class="rel-node">#${r.target_id||r.id} <span class="rel-edge">${esc(r.relation)}</span></span>`).join('');
    }
    if(d.usage) html += `<details><summary>使用统计</summary><pre>${esc(JSON.stringify(d.usage,null,2))}</pre></details>`;
    $('#detailBody').innerHTML = html;
  }
  $('#detailModalBg').classList.add('show');
  $('#detailFeedback').onclick = async ()=>{
    const j2=await api(`/api/memories/${id}/feedback`,{method:'POST',body:JSON.stringify({feedback_type:'helpful'})});
    toast(j2.ok?'已记录':'失败', j2.ok?'ok':'err');
  };
}
$('#detailClose').onclick = ()=>$('#detailModalBg').classList.remove('show');

async function openLinks(id){
  const j = await api(`/api/memories/${id}/links`);
  let html = `<p class="small">为 #${id} 添加关系</p>
    <div class="toolbar">
      <input id="lnkTarget" placeholder="目标记忆 id" style="width:120px" type="number" />
      <select id="lnkRel"><option value="related">related</option><option value="supersedes">supersedes</option><option value="derived_from">derived_from</option><option value="contradicts">contradicts</option><option value="supports">supports</option></select>
      <input id="lnkNote" placeholder="备注" style="flex:1" />
      <button id="lnkAdd">添加</button>
    </div>
    <div id="lnkList"></div>`;
  $('#detailBody').innerHTML = html;
  $('#detailId').textContent = '#'+id+' 关系';
  const render = (links)=>{
    $('#lnkList').innerHTML = (links||[]).map(l=>
      `<div class="rel-node">#${l.target_memory_id||l.target_id} <span class="rel-edge">${esc(l.relation)}</span> ${esc(l.note||'')}</div>`
    ).join('') || '<div class="empty small">暂无关系</div>';
  };
  if(j.ok) render(j.data);
  $('#lnkAdd').onclick = async ()=>{
    const t=parseInt($('#lnkTarget').value); if(!t){toast('填目标 id','err');return;}
    const r=await api('/api/links',{method:'POST',body:JSON.stringify({source_memory_id:id,target_memory_id:t,relation:$('#lnkRel').value,note:$('#lnkNote').value})});
    if(r.ok){ toast('已添加'); const j2=await api(`/api/memories/${id}/links`); if(j2.ok) render(j2.data); }
    else toast(r.message,'err');
  };
  $('#detailModalBg').classList.add('show');
}

/* ---------- 任务 ---------- */
async function loadTasks(){
  const j = await api('/api/tasks');
  if(!j.ok){ $('#taskList').innerHTML=`<div class="empty">${esc(j.message)}</div>`; return; }
  $('#taskList').innerHTML = j.data.length ? j.data.map(taskCard).join('') : '<div class="empty">暂无任务</div>';
}
function taskCard(t){
  const plan = (t.plan||[]).map(p=>`<li class="small">${p.status==='done'?'✅':'⬜'} ${esc(p.title||'')}</li>`).join('');
  let color = t.status==='completed'?'var(--ok)':t.status==='handoff'?'var(--warn)':'var(--accent)';
  return `<div class="card" data-id="${t.id}">
    <div class="top" style="display:flex;gap:8px;align-items:center">
      <span class="id">#${t.id}</span>
      <b>${esc(t.title)}</b>
      <span class="badge" style="color:${color}">${esc(t.status)}</span>
      <span class="muted small">阶段 ${t.current_stage}</span>
    </div>
    <div class="content small">${esc(t.goal)}</div>
    ${plan?`<ul style="margin:6px 0">${plan}</ul>`:''}
    ${t.result?`<div class="small muted">结果: ${esc(t.result)}</div>`:''}
    <div class="acts">
      <button class="ghost" onclick="taskDetail(${t.id})">查看</button>
      <button class="ghost" onclick="stageModal(${t.id},'snapshot')">存快照</button>
      <button class="warn" onclick="stageModal(${t.id},'handoff')">交接</button>
      <button class="ok" onclick="completeTask(${t.id})">完成</button>
      <button class="ghost" onclick="resumeTask(${t.id})">恢复活跃</button>
    </div>
  </div>`;
}
$('#taskNew').onclick = ()=>$('#taskModalBg').classList.add('show');
$('#taskCancel').onclick = ()=>$('#taskModalBg').classList.remove('show');
$('#taskRefresh').onclick = loadTasks;
$('#taskSave').onclick = async ()=>{
  const j = await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('#taskTitle').value,goal:$('#taskGoal').value})});
  if(j.ok){ toast('已创建任务 #'+j.data.id); $('#taskModalBg').classList.remove('show'); loadTasks(); loadStats(); }
  else toast(j.message,'err');
};
async function taskDetail(id){
  const j = await api(`/api/tasks/${id}`);
  if(!j.ok){ toast(j.message,'err'); return; }
  const t=j.data;
  let html=`<div class="detail-grid">
    <div class="k">id</div><div>${t.id}</div>
    <div class="k">标题</div><div>${esc(t.title)}</div>
    <div class="k">状态</div><div>${esc(t.status)}</div>
    <div class="k">阶段</div><div>${t.current_stage}</div>
    <div class="k">目标</div><div>${esc(t.goal)}</div>
    <div class="k">结果</div><div>${esc(t.result||'')}</div>
  </div>`;
  if(t.snapshots&&t.snapshots.length){
    html+='<h4>阶段快照</h4>';
    html+=t.snapshots.map(s=>`<div class="card small"><b>阶段 ${s.stage}</b> <span class="muted">${esc(s.created_at)}</span><div>${esc(s.summary)}</div></div>`).join('');
  }
  $('#detailId').textContent='#'+id;
  $('#detailBody').innerHTML=html;
  $('#detailFeedback').style.display='none';
  $('#detailModalBg').classList.add('show');
}
function stageModal(id, mode){
  $('#stageTaskId').value=id; $('#stageMode').value=mode;
  $('#taskStageTitle').textContent = mode==='handoff'?'任务交接':'保存阶段快照';
  $('#stageSummary').value=''; $('#stageState').value='{}';
  $('#taskStageBg').classList.add('show');
}
$('#stageCancel').onclick=()=>$('#taskStageBg').classList.remove('show');
$('#stageSave').onclick=async ()=>{
  const id=$('#stageTaskId').value, mode=$('#stageMode').value;
  let stateJson=$('#stageState').value.trim()||'{}';
  try{ JSON.parse(stateJson); }catch(e){ toast('状态 JSON 非法','err'); return; }
  const body=JSON.stringify({summary:$('#stageSummary').value, state_json:stateJson});
  const j = await api(`/api/tasks/${id}/${mode}`,{method:'POST',body});
  if(j.ok){ toast(mode==='handoff'?'已交接':'已存快照'); $('#taskStageBg').classList.remove('show'); loadTasks(); }
  else toast(j.message,'err');
};
async function completeTask(id){ const j=await api(`/api/tasks/${id}/complete`,{method:'POST',body:JSON.stringify({result:''})}); toast(j.ok?'已完成':'失败', j.ok?'ok':'err'); loadTasks(); loadStats(); }
async function resumeTask(id){ const j=await api(`/api/tasks/${id}/resume`,{method:'POST'}); toast(j.ok?'已恢复':'失败', j.ok?'ok':'err'); loadTasks(); }

/* ---------- 治理 ---------- */
async function loadGovStatus(){
  const j = await api('/api/embedding_status');
  if(j.ok){
    const e=j.data;
    const ready = e.model_load_status==='ready';
    $('#embStatus').textContent = ready?`嵌入: 就绪 (${e.indexed_active_memories}/${e.total_active_memories} 已索引)`:`嵌入: ${e.model_load_status||'?'} (${e.indexed_active_memories||0}/${e.total_active_memories||0})`;
    $('#embStatus').className = 'pill'+(ready?'':' warn');
  }
}
$('#govRefresh').onclick = loadGovStatus;
$('#govWarmup').onclick = async ()=>{ const j=await api('/api/embedding/warmup',{method:'POST'}); toast(j.ok?'已触发预热':'失败', j.ok?'ok':'err'); setTimeout(loadGovStatus,1500); };
$('#govScore').onclick = async ()=>{
  const j=await api(`/api/governance/score?category=${encodeURIComponent($('#govCategory').value)}&limit=50`);
  if(!j.ok){ toast(j.message,'err'); return; }
  // 后端返回 {ok, data:{ok, scored, results:[...]}}；原来读 j.data.scores 拿到的是对象，
  // 对对象调 .slice 会抛异常，界面就一片空白。
  const rows=(j.data?.results||[]).slice(0,50);
  $('#govOut').innerHTML=`<h3>评分扫描 (${rows.length})</h3>`+(rows.length?`<table><tr><th>id</th><th>分类</th><th>重要</th><th>置信</th><th>新鲜</th><th>访问</th></tr>${
    rows.map(r=>`<tr><td>#${r.memory_id??r.id}</td><td>${esc(r.category||'')}</td><td>${r.importance??r.importance_score??'-'}</td><td>${r.confidence_score??'-'}</td><td>${r.freshness!=null?Number(r.freshness).toFixed(1):(r.freshness_score??'-')}</td><td>${r.access_count??'-'}</td></tr>`).join('')
  }</table>`:'<div class="empty">没有可评分的记忆</div>');
};
$('#govDetect').onclick = async ()=>{
  const j=await api('/api/governance/detect',{method:'POST',body:JSON.stringify({category:$('#govCategory').value})});
  if(!j.ok){ toast(j.message,'err'); return; }
  const rows=j.data?.findings||[];
  $('#govOut').innerHTML=`<h3>冲突检测 (${rows.length})</h3>`+(rows.length?`<table><tr><th>id_a</th><th>id_b</th><th>类型</th><th>相似</th><th>建议</th></tr>${
    rows.map(r=>`<tr><td>#${r.memory_id}</td><td>#${r.candidate_memory_id}</td><td>${esc(r.conflict_type)}</td><td>${r.similarity?.toFixed?.(3)??r.similarity}</td><td>${esc(r.recommendation)}</td></tr>`).join('')
  }</table>`:'<div class="empty">未发现冲突</div>');
};
$('#govDup').onclick = async ()=>{
  const j=await api(`/api/governance/duplicates?category=${encodeURIComponent($('#govCategory').value)}`);
  if(!j.ok){ toast(j.message,'err'); return; }
  // find_duplicate_memories 返回 {ok, duplicate_count, duplicates:[...]}
  const rows=j.data?.duplicates||j.data?.findings||[];
  $('#govOut').innerHTML=`<h3>重复识别 (${rows.length})</h3>`+(rows.length?rows.map(r=>`<div class="card small"><b>#${r.memory_id??r.id}</b> ↔ <b>#${r.candidate_memory_id??'-'}</b> ${esc(r.content||r.reason||'')}</div>`).join(''):'<div class="empty">未发现重复</div>');
};
$('#govConsol').onclick = async ()=>{
  const j=await api(`/api/governance/consolidation?limit=50`);
  if(!j.ok){ toast(j.message,'err'); return; }
  const rows=j.data?.candidates||[];
  $('#govOut').innerHTML=`<h3>巩固候选 (${rows.length})</h3>`+(rows.length?rows.map(r=>`<div class="card small"><span class="badge ${r.status}">${esc(r.status)}</span> <b>${esc(r.kind||r.type||'')}</b> ${esc(r.title||'')}<div class="muted">${esc(r.detail||'')}</div></div>`).join(''):'<div class="empty">暂无候选</div>');
};

/* ---------- 启动 ---------- */
(async ()=>{
  bindStarEvents();
  await loadStats();
  await loadCategories();
  await loadMemories();
})();
</script>
</body>
</html>
